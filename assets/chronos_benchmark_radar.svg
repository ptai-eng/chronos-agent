<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="100%" height="100%" role="img" aria-labelledby="radar-title radar-desc">
  <title id="radar-title">CHRONOS-AGENT v1.8.1 — Capability Profile &amp; Reproducible Benchmark</title>
  <desc id="radar-desc">Five-axis capability radar comparing CHRONOS-AGENT v1.8.1 against Vanilla AI Agents and Static Linters alongside measured chronos_explore benchmark results (-69.4% to -72.0% estimated tokens, 3x-4x fewer round-trips, 3.6-5.2ms debug median across TypeScript, Python, and Rust fixtures).</desc>

  <!-- Editorial Paper Background -->
  <rect width="1120" height="520" rx="8" fill="#f5f5f5"/>
  <rect x="4" y="4" width="1112" height="512" rx="6" fill="none" stroke="rgba(45,49,66,0.14)" stroke-width="1"/>

  <!-- Header -->
  <text x="40" y="36" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', Consolas, monospace" letter-spacing="0.14em">CAPABILITY &amp; TOKEN BENCHMARK // V1.8.1 EVALUATION</text>
  <text x="40" y="64" fill="#2d3142" font-size="24" font-weight="600" font-family="Georgia, 'Instrument Serif', serif">CHRONOS-AGENT v1.8.1 vs. Vanilla Coding Agents &amp; Static Linters</text>
  <line x1="40" y1="80" x2="1080" y2="80" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

  <!-- Radar Center at (335, 296), Radius R = 140 -->
  <polygon points="335,156 468,253 417,409 253,409 202,253" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <polygon points="335,191 435,264 397,381 273,381 235,264" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <polygon points="335,226 402,274 376,353 294,353 268,274" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <polygon points="335,261 368,285 356,324 314,324 302,285" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Axis Spokes -->
  <line x1="335" y1="296" x2="335" y2="156" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <line x1="335" y1="296" x2="468" y2="253" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <line x1="335" y1="296" x2="417" y2="409" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <line x1="335" y1="296" x2="253" y2="409" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <line x1="335" y1="296" x2="202" y2="253" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>

  <!-- Series 3: Static Linters (ESLint / Clippy) — Muted Slate (#4f5d75) -->
  <polygon points="335,240 354,289 348,314 321,316 298,283" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Series 2: Vanilla AI Agents (Grep + Read) — Link Blue (#2e5aa8) -->
  <polygon points="335,244 360,287 350,318 318,320 302,285" fill="rgba(46,90,168,0.10)" stroke="#2e5aa8" stroke-width="1.6"/>

  <!-- Series 1: CHRONOS-AGENT v1.8.1 (Focal Coral #eb6c36) -->
  <polygon points="335,160 462,255 413,403 257,403 208,255" fill="rgba(235,108,54,0.16)" stroke="#eb6c36" stroke-width="2.4"/>

  <!-- Focal Vertex Dots -->
  <circle cx="335" cy="160" r="4.5" fill="#eb6c36" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="462" cy="255" r="4.5" fill="#eb6c36" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="413" cy="403" r="4.5" fill="#eb6c36" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="257" cy="403" r="4.5" fill="#eb6c36" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="208" cy="255" r="4.5" fill="#eb6c36" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Axis Labels -->
  <text x="335" y="116" fill="#2d3142" font-size="11.5" font-weight="600" font-family="-apple-system, 'Geist', sans-serif" text-anchor="middle">1. Polyglot Graph + Hybrid LSP</text>
  <text x="335" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', Consolas, monospace" text-anchor="middle">7 Langs • KuzuDB 0.11.3 • Opt-In LSP</text>

  <text x="480" y="248" fill="#2d3142" font-size="11.5" font-weight="600" font-family="-apple-system, 'Geist', sans-serif" text-anchor="start">2. AST Edit &amp; Edge Refactor</text>
  <text x="480" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', Consolas, monospace" text-anchor="start">2-Stage Gate • Verified vs Candidate</text>

  <text x="430" y="432" fill="#2d3142" font-size="11.5" font-weight="600" font-family="-apple-system, 'Geist', sans-serif" text-anchor="start">3. Super-Mutant &amp; Rhai Sandbox</text>
  <text x="430" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', Consolas, monospace" text-anchor="start">Single-Compile • 50k Ops Cap • CI Gate</text>

  <text x="240" y="432" fill="#2d3142" font-size="11.5" font-weight="600" font-family="-apple-system, 'Geist', sans-serif" text-anchor="end">4. 5D Blast-Radius &amp; Git Coupling</text>
  <text x="240" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', Consolas, monospace" text-anchor="end">Co-Changes • Reverse-BFS • CI Bounds</text>

  <text x="190" y="248" fill="#2d3142" font-size="11.5" font-weight="600" font-family="-apple-system, 'Geist', sans-serif" text-anchor="end">5. 1-Call Explore &amp; Telemetry</text>
  <text x="190" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', Consolas, monospace" text-anchor="end">-69% to -72% Tokens • CDP / OTLP</text>

  <!-- Right-hand Editorial Scorecard Panel -->
  <rect x="696" y="108" width="384" height="360" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.14)" stroke-width="1"/>
  <text x="720" y="136" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', Consolas, monospace" letter-spacing="0.12em">MEASURED BENCHMARK &amp; SCORECARD</text>
  <line x1="720" y1="148" x2="1056" y2="148" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>

  <!-- Card Item 1: CHRONOS -->
  <circle cx="728" cy="176" r="5" fill="#eb6c36"/>
  <text x="744" y="180" fill="#2d3142" font-size="14" font-weight="600" font-family="-apple-system, 'Geist', sans-serif">CHRONOS-AGENT v1.8.1</text>
  <text x="1056" y="180" fill="#eb6c36" font-size="13" font-weight="600" font-family="'Geist Mono', Consolas, monospace" text-anchor="end">-69% to -72% Tok</text>
  <text x="744" y="200" fill="#4f5d75" font-size="10.5" font-family="-apple-system, 'Geist', sans-serif">TS -72.0% (5.2ms) • Py -69.4% (4.0ms) • Rs -71.9% (3.6ms)</text>
  <text x="744" y="216" fill="#4f5d75" font-size="10.5" font-family="-apple-system, 'Geist', sans-serif">3x–4x fewer calls • 14 MCP tools • AST gate + Hybrid LSP</text>

  <line x1="720" y1="236" x2="1056" y2="236" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>

  <!-- Card Item 2: Vanilla AI Coding Agents -->
  <circle cx="728" cy="264" r="5" fill="#2e5aa8"/>
  <text x="744" y="268" fill="#2d3142" font-size="14" font-weight="600" font-family="-apple-system, 'Geist', sans-serif">Vanilla AI Agents (Grep + Read)</text>
  <text x="1056" y="268" fill="#2e5aa8" font-size="13" font-weight="600" font-family="'Geist Mono', Consolas, monospace" text-anchor="end">3–4x Calls</text>
  <text x="744" y="288" fill="#4f5d75" font-size="10.5" font-family="-apple-system, 'Geist', sans-serif">Sequential grep + full-file reads (9.2k–13.1k chars);</text>
  <text x="744" y="304" fill="#4f5d75" font-size="10.5" font-family="-apple-system, 'Geist', sans-serif">blind to runtime hotspots, transitive callers &amp; drift.</text>

  <line x1="720" y1="324" x2="1056" y2="324" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>

  <!-- Card Item 3: Static Linters -->
  <circle cx="728" cy="352" r="5" fill="#4f5d75"/>
  <text x="744" y="356" fill="#2d3142" font-size="14" font-weight="600" font-family="-apple-system, 'Geist', sans-serif">Static Linters (ESLint / Clippy)</text>
  <text x="1056" y="356" fill="#4f5d75" font-size="13" font-weight="600" font-family="'Geist Mono', Consolas, monospace" text-anchor="end">Single-File</text>
  <text x="744" y="376" fill="#4f5d75" font-size="10.5" font-family="-apple-system, 'Geist', sans-serif">Per-file syntax &amp; formatting rules; no cross-file</text>
  <text x="744" y="392" fill="#4f5d75" font-size="10.5" font-family="-apple-system, 'Geist', sans-serif">blast-radius propagation, mutation gate, or rollback.</text>

  <!-- Metrological Note -->
  <rect x="720" y="412" width="336" height="40" rx="4" fill="#f5f5f5"/>
  <text x="732" y="428" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist Mono', Consolas, monospace">BENCHMARKS/RESULTS.JSON • 157/157 TESTS</text>
  <text x="732" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', Consolas, monospace">Never conflates unobserved edges with 0 callers.</text>

  <!-- Bottom Legend Strip -->
  <line x1="40" y1="484" x2="1080" y2="484" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="40" y="504" fill="#4f5d75" font-size="8" font-weight="600" font-family="'Geist Mono', Consolas, monospace" letter-spacing="0.14em">SERIES</text>
  <line x1="104" y1="500" x2="128" y2="500" stroke="#eb6c36" stroke-width="2.4"/>
  <text x="136" y="504" fill="#2d3142" font-size="9" font-family="-apple-system, 'Geist', sans-serif">CHRONOS-AGENT v1.8.1 (Focal)</text>
  <line x1="312" y1="500" x2="336" y2="500" stroke="#2e5aa8" stroke-width="1.6"/>
  <text x="344" y="504" fill="#2d3142" font-size="9" font-family="-apple-system, 'Geist', sans-serif">Vanilla AI Agents (Grep + Read)</text>
  <line x1="516" y1="500" x2="540" y2="500" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="548" y="504" fill="#2d3142" font-size="9" font-family="-apple-system, 'Geist', sans-serif">Static Linters</text>
</svg>
