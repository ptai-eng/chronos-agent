<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="100%" height="100%" role="img" aria-labelledby="radar-title radar-desc">
  <title id="radar-title">CHRONOS-AGENT v1.5 — 5-Axis Capability Comparison Radar</title>
  <desc id="radar-desc">Five-axis radar chart comparing CHRONOS-AGENT v1.5 against Vanilla AI Agents and Static Linters across Polyglot Call-Graph &amp; Cross-Boundary Route Stitching, Runtime &amp; Offline Telemetry Hydration, Super-Mutant Single-Compile Gate, 5D Git Co-Change Blast-Radius, and Contract Safety.</desc>

  <!-- Editorial Paper Background -->
  <rect width="1120" height="520" rx="8" fill="#f5f5f5"/>
  <rect x="4" y="4" width="1112" height="512" rx="6" fill="none" stroke="rgba(45,49,66,0.14)" stroke-width="1"/>

  <!-- Header -->
  <text x="40" y="36" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', Consolas, monospace" letter-spacing="0.14em">CAPABILITY BENCHMARK // 5-AXIS EVALUATION</text>
  <text x="40" y="64" fill="#2d3142" font-size="24" font-weight="600" font-family="Georgia, 'Instrument Serif', serif">CHRONOS-AGENT v1.5 vs. Vanilla Coding Agents &amp; Static Linters</text>
  <line x1="40" y1="80" x2="1080" y2="80" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

  <!-- Radar Center at (380, 296), Radius R = 160 -->
  <polygon points="380,136 532,247 474,425 286,425 228,247" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <polygon points="380,176 494,259 451,393 309,393 266,259" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <polygon points="380,216 456,271 427,361 333,361 304,271" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <polygon points="380,256 418,284 404,328 356,328 342,284" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Axis Spokes -->
  <line x1="380" y1="296" x2="380" y2="136" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <line x1="380" y1="296" x2="532" y2="247" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <line x1="380" y1="296" x2="474" y2="425" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <line x1="380" y1="296" x2="286" y2="425" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <line x1="380" y1="296" x2="228" y2="247" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>

  <!-- Series 3: Static Linters (ESLint / Clippy) — Muted Slate (#4f5d75) -->
  <polygon points="380,232 395,291 394,315 356,328 334,281" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Series 2: Vanilla AI Agents (Prompt-Only) — Link Blue (#2e5aa8) -->
  <polygon points="380,240 403,289 399,322 352,335 350,286" fill="rgba(46,90,168,0.10)" stroke="#2e5aa8" stroke-width="1.6"/>

  <!-- Series 1: CHRONOS-AGENT v1.5 (Focal Coral #eb6c36) -->
  <polygon points="380,138 525,249 471,421 289,421 236,249" fill="rgba(235,108,54,0.16)" stroke="#eb6c36" stroke-width="2.4"/>

  <!-- Focal Vertex Dots -->
  <circle cx="380" cy="138" r="4.5" fill="#eb6c36" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="525" cy="249" r="4.5" fill="#eb6c36" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="471" cy="421" r="4.5" fill="#eb6c36" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="289" cy="421" r="4.5" fill="#eb6c36" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="236" cy="249" r="4.5" fill="#eb6c36" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Axis Labels -->
  <text x="380" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, 'Geist', sans-serif" text-anchor="middle">1. Polyglot Graph + Route Stitching</text>
  <text x="380" y="124" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', Consolas, monospace" text-anchor="middle">7 Langs • xxHash64 Merkle • HTTP Bridge (99%)</text>

  <text x="548" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, 'Geist', sans-serif" text-anchor="start">2. Live &amp; Offline Telemetry</text>
  <text x="548" y="260" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', Consolas, monospace" text-anchor="start">V8 / Speedscope / Flamegraph / OTLP (96%)</text>

  <text x="488" y="448" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, 'Geist', sans-serif" text-anchor="start">3. Super-Mutant Gate</text>
  <text x="488" y="464" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', Consolas, monospace" text-anchor="start">Single-Compile Env Switch • 90% Gate (97%)</text>

  <text x="272" y="448" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, 'Geist', sans-serif" text-anchor="end">4. 5D Blast-Radius &amp; Git Coupling</text>
  <text x="272" y="464" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', Consolas, monospace" text-anchor="end">Git Co-Changes + CI Bounds (98%)</text>

  <text x="212" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, 'Geist', sans-serif" text-anchor="end">5. Pre-Tool Contract Gate</text>
  <text x="212" y="260" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', Consolas, monospace" text-anchor="end">30ms Signature Diff + Provenance (95%)</text>

  <!-- Right-hand Editorial Scorecard Panel -->
  <rect x="708" y="108" width="372" height="360" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.14)" stroke-width="1"/>
  <text x="732" y="136" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', Consolas, monospace" letter-spacing="0.12em">COMPARATIVE SCORECARD</text>
  <line x1="732" y1="148" x2="1056" y2="148" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>

  <!-- Card Item 1: CHRONOS -->
  <circle cx="740" cy="176" r="5" fill="#eb6c36"/>
  <text x="756" y="180" fill="#2d3142" font-size="14" font-weight="600" font-family="-apple-system, 'Geist', sans-serif">CHRONOS-AGENT v1.5</text>
  <text x="1056" y="180" fill="#eb6c36" font-size="14" font-weight="600" font-family="'Geist Mono', Consolas, monospace" text-anchor="end">97.0%</text>
  <text x="756" y="200" fill="#4f5d75" font-size="11" font-family="-apple-system, 'Geist', sans-serif">5D Knowledge Graph, OpenAI Codex AGENTS.md synthesizer,</text>
  <text x="756" y="216" fill="#4f5d75" font-size="11" font-family="-apple-system, 'Geist', sans-serif">HTTP route stitching, Git coupling, and Super-Mutant gate.</text>

  <line x1="732" y1="236" x2="1056" y2="236" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>

  <!-- Card Item 2: Vanilla AI Coding Agents -->
  <circle cx="740" cy="264" r="5" fill="#2e5aa8"/>
  <text x="756" y="268" fill="#2d3142" font-size="14" font-weight="600" font-family="-apple-system, 'Geist', sans-serif">Vanilla AI Agents (Prompt-Only)</text>
  <text x="1056" y="268" fill="#2e5aa8" font-size="14" font-weight="600" font-family="'Geist Mono', Consolas, monospace" text-anchor="end">24.0%</text>
  <text x="756" y="288" fill="#4f5d75" font-size="11" font-family="-apple-system, 'Geist', sans-serif">Limited to current context window; blind to runtime</text>
  <text x="756" y="304" fill="#4f5d75" font-size="11" font-family="-apple-system, 'Geist', sans-serif">hot-paths, transitive callers, and weak test assertions.</text>

  <line x1="732" y1="324" x2="1056" y2="324" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>

  <!-- Card Item 3: Static Linters -->
  <circle cx="740" cy="352" r="5" fill="#4f5d75"/>
  <text x="756" y="356" fill="#2d3142" font-size="14" font-weight="600" font-family="-apple-system, 'Geist', sans-serif">Static Linters (ESLint / SonarQube)</text>
  <text x="1056" y="356" fill="#4f5d75" font-size="14" font-weight="600" font-family="'Geist Mono', Consolas, monospace" text-anchor="end">22.0%</text>
  <text x="756" y="376" fill="#4f5d75" font-size="11" font-family="-apple-system, 'Geist', sans-serif">Single-file syntax &amp; formatting rules; no cross-file</text>
  <text x="756" y="392" fill="#4f5d75" font-size="11" font-family="-apple-system, 'Geist', sans-serif">blast-radius propagation or mutation verification.</text>

  <!-- Metrological Note -->
  <rect x="732" y="412" width="324" height="40" rx="4" fill="#f5f5f5"/>
  <text x="744" y="428" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist Mono', Consolas, monospace">UNCERTAINTY &amp; COVERAGE CONTRACT</text>
  <text x="744" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', Consolas, monospace">Never conflates unobserved edges with 0 callers.</text>

  <!-- Bottom Legend Strip -->
  <line x1="40" y1="484" x2="1080" y2="484" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="40" y="504" fill="#4f5d75" font-size="8" font-weight="600" font-family="'Geist Mono', Consolas, monospace" letter-spacing="0.14em">SERIES</text>
  <line x1="104" y1="500" x2="128" y2="500" stroke="#eb6c36" stroke-width="2.4"/>
  <text x="136" y="504" fill="#2d3142" font-size="9" font-family="-apple-system, 'Geist', sans-serif">CHRONOS-AGENT v1.5 (Focal)</text>
  <line x1="304" y1="500" x2="328" y2="500" stroke="#2e5aa8" stroke-width="1.6"/>
  <text x="336" y="504" fill="#2d3142" font-size="9" font-family="-apple-system, 'Geist', sans-serif">Vanilla AI Coding Agents</text>
  <line x1="488" y1="500" x2="512" y2="500" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="520" y="504" fill="#2d3142" font-size="9" font-family="-apple-system, 'Geist', sans-serif">Static Linters</text>
</svg>
