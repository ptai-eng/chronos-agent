name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            archive_name: chronos-windows-x64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            archive_name: chronos-linux-x64.tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Prepare Artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p release-binaries
          cp target/${{ matrix.target }}/release/chronos-mcp release-binaries/
          cp target/${{ matrix.target }}/release/chronos release-binaries/
          tar -czvf ${{ matrix.archive_name }} -C release-binaries .

      - name: Prepare Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir release-binaries
          copy target\${{ matrix.target }}\release\chronos-mcp.exe release-binaries\
          copy target\${{ matrix.target }}\release\chronos.exe release-binaries\
          Compress-Archive -Path release-binaries\* -DestinationPath ${{ matrix.archive_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.archive_name }}

  build-macos:
    name: Build macos-arm64
    runs-on: macos-latest
    timeout-minutes: 50
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --workspace --target aarch64-apple-darwin

      - name: Prepare Artifacts (macOS)
        run: |
          mkdir -p release-binaries
          cp target/aarch64-apple-darwin/release/chronos-mcp release-binaries/
          cp target/aarch64-apple-darwin/release/chronos release-binaries/
          tar -czvf chronos-macos-arm64.tar.gz -C release-binaries .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: chronos-macos-arm64.tar.gz

  release:
    name: Create Release
    needs: [build, build-macos]
    # Publish release whenever required windows-x64 & linux-x64 builds succeed even if macos-latest runner pool hits capacity
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt & Homebrew Formula
        run: |
          (cd artifacts && sha256sum chronos-* > SHA256SUMS.txt || true)
          python3 scripts/render_homebrew_formula.py --version "${{ github.ref_name }}" --sums artifacts/SHA256SUMS.txt --out artifacts/chronos.rb || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-mcp-registry:
    name: Build GHCR Image & Publish MCP Registry
    needs: [release]
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve version & repository slug
        id: meta
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          build-args: |
            CHRONOS_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.repo }}:latest

      - name: Sync server.json metadata
        run: |
          jq \
            --arg v "${{ steps.meta.outputs.version }}" \
            --arg img "ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}" \
            '.version = $v | .packages[0].identifier = $img' \
            server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate via GitHub OIDC and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
