name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            archive_name: chronos-windows-x64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            archive_name: chronos-linux-x64.tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Prepare Artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p release-binaries
          cp target/${{ matrix.target }}/release/chronos-mcp release-binaries/
          cp target/${{ matrix.target }}/release/chronos release-binaries/
          tar -czvf ${{ matrix.archive_name }} -C release-binaries .

      - name: Prepare Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir release-binaries
          copy target\${{ matrix.target }}\release\chronos-mcp.exe release-binaries\
          copy target\${{ matrix.target }}\release\chronos.exe release-binaries\
          Compress-Archive -Path release-binaries\* -DestinationPath ${{ matrix.archive_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.archive_name }}

  build-macos:
    name: Build macos-arm64
    runs-on: macos-latest
    timeout-minutes: 50
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --workspace --target aarch64-apple-darwin

      - name: Prepare Artifacts (macOS)
        run: |
          mkdir -p release-binaries
          cp target/aarch64-apple-darwin/release/chronos-mcp release-binaries/
          cp target/aarch64-apple-darwin/release/chronos release-binaries/
          tar -czvf chronos-macos-arm64.tar.gz -C release-binaries .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: chronos-macos-arm64.tar.gz

  release:
    name: Create Release
    needs: [build, build-macos]
    # Publish release whenever required windows-x64 & linux-x64 builds succeed even if macos-latest runner pool hits capacity
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd artifacts
          sha256sum chronos-* > SHA256SUMS.txt || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
